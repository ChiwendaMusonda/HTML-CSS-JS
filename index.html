<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <title>QUIZ  GAME</title>
</head>
<body>
   <div class="container">
    <div class="screen active" id="start-screen">
        <h1>Quiz time!</h1>
        <p>Test your knowledge with these fun questions.</p>
        <button id="start-btn">Start quiz</button>
    </div>
    <div class="screen" id="quiz-screen">
        <div class="quiz-header">
            <h2 id="question-text"></h2>
            <div class="quiz-info">
                <p>Question <span id="current-question"></span> of <span id="question-total"></span></p>
                <p>Score <span id="current-score"></span></p>
            </div>
        </div>


        <div id="answer-container" class="answer-container"></div>

        
        <div class="progress-bar"><div class="progress" id="progress"></div></div>
    </div>
    <div id="result-screen" class="screen" >
        <h1>Quiz results</h1>

        <div class="result-info">
            <p>You scored <span id="final-score">0</span> out of <span id="max-score"></span>.</p>
            <div id="result-message"></div>
        </div>
        <button id="restart-btn">Restart quiz</button>
    </div>
   </div>
</body>
</html>
